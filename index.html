<!DOCTYPE html>
<html lang="fi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Another Generic Shop</title>
        <link rel="stylesheet" href="CSS%26Images/styles.css">
        <script src="JS/scripts.js" defer></script>
    </head>
    <body>
        <header>
            <h1 class="centerify">Another generic shop.</H1>
        </header>
        <main>

            <section id="productList"> 
                <div id="searchbar" class="boxify flexcenter">
                    <button id="searchButton">Get items</button>
                    <button id="shoppingListButton">Open Shopping List</button>
                </div>
                <table id="productSearchList">
                    <thead>
                        <tr>
                            <!-- <th class="ProductImgTH"></th> Unused for now. -->
                            <th>Product Name</th>
                            <th>Product Price</th>
                            <th>Product Description</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="productListBody">
                    </tbody>
                </table>
                <h1 id="message1" class="boxify">Press "Get items" to list products.</h1>
            </section>



            <section id="shoppingList">
                <table id="shoppingListTable">
                    <div id="topSection" class="boxify">
                        <button id="closeShoppingList">Close Shopping List</button>
                        <h2>Shopping List</h2>
                    </div>
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Product Price</th>
                            <th>Product Description</th>
                            <th class="removeItemTH">Remove</th>
                        </tr>
                    </thead>
                    <tbody id="shoppingListTableBody">
                    </tbody>
                </table>
                <h1 id="message2" class="boxify">This list is empty!</h1>
            </section>
        </main>
    </body>
</html>
